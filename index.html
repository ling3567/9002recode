<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醫教會會議紀錄查詢</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 設定 Inter 字體 */
        body {
            font-family: 'Inter', "Microsoft JhengHei", sans-serif;
            background-color: #f0f9ff; /* 淺天空藍背景 */
        }
        /* 自定義滾動條樣式 */
        .scrollable-content::-webkit-scrollbar {
            width: 8px;
        }
        .scrollable-content::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .scrollable-content::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        .scrollable-content::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        /* 關鍵字高亮樣式 */
        .highlight {
            background-color: #fde68a; /* 淺黃色背景 */
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: bold;
        }
        /* 登入視窗背景 */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999; /* 確保在最上層 */
        }
        /* 登入視窗內容 */
        .modal-content {
            z-index: 1000; /* 確保在最上層 */
        }
        /* 區塊內容隱藏/顯示動畫 */
        .section-content {
            max-height: 0; /* 預設收合 */
            overflow: hidden;
            transition: max-height 0.5s ease-in-out; /* 調整過渡時間 */
        }
        .section-content.expanded { /* 展開時使用這個類別 */
            max-height: 9999px; /* 足夠大的值以顯示內容 */
        }
        /* 箭頭旋轉 */
        .arrow-icon {
            transition: transform 0.3s ease;
            transform: rotate(0deg); /* 預設收合，箭頭向右 */
        }
        .arrow-icon.expanded { /* 展開時使用這個類別 */
            transform: rotate(90deg); /* 展開時箭頭向下 */
        }
        /* 文件預覽模態視窗樣式 */
        #documentViewerModal {
            display: none; /* 預設隱藏 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #documentViewerModal.flex {
            display: flex; /* 顯示時變為 flex */
        }
        .document-viewer-content {
            background-color: white;
            padding: 1rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            height: 90%;
            max-width: 1000px; /* 最大寬度 */
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .document-viewer-iframe {
            flex-grow: 1; /* 讓 iframe 佔滿剩餘空間 */
            border: none;
            width: 100%;
            height: 100%;
        }
        .document-viewer-close {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #4b5563; /* gray-600 */
        }

        /* 增加會議內容可讀性 */
        .section-content, .section-content p {
            font-size: 1.05rem !important;
            line-height: 1.8 !important; /* 增加行距 */
        }

        /* 會議內容排版樣式 (完美懸掛縮排) */
        .level-1 {
            margin-left: 2em; 
            text-indent: -2em; 
        }
        .level-2 {
            margin-left: 2.5em; /* 整段往內縮 */
            text-indent: -1.5em; /* 數字往外拉 */
        }
        .level-3 {
            margin-left: 4em; 
            text-indent: -1.5em; 
        }
    </style>
</head>
<body class="bg-sky-50 flex flex-col items-center min-h-screen p-4">
    <!-- 新增會議內容按鈕 (固定在右上角) -->
    <a id="addMeetingButton"
       class="fixed top-4 right-4 px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-150 ease-in-out text-base z-50 cursor-pointer">
        管理會議內容
    </a>

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-5xl border border-gray-200 mb-8 mt-16 md:mt-4">
        <h1 class="text-3xl font-bold text-blue-800 mb-8 text-center">醫學教育委員會會議紀錄查詢</h1>

        <section id="monthQuickNav" class="mb-8 bg-blue-50 border border-blue-200 rounded-xl p-4 shadow-sm">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between">
                <div class="flex items-center justify-between w-full sm:w-auto">
                    <!-- 年份切換 (左) -->
                    <button id="prevYearButton" type="button" class="p-2 rounded-full hover:bg-blue-200 text-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>
                    </button>
                    <!-- 年份標題 -->
                    <div class="text-center mx-4">
                        <p class="text-xs tracking-wider text-blue-500 font-bold uppercase whitespace-nowrap mb-1">快速月份導覽</p>
                        <p id="monthQuickNavYear" class="text-xl font-black text-blue-900 whitespace-nowrap">114 年</p>
                    </div>
                    <!-- 年份切換 (右) -->
                    <button id="nextYearButton" type="button" class="p-2 rounded-full hover:bg-blue-200 text-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition disabled:opacity-30 disabled:cursor-not-allowed">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path></svg>
                    </button>
                </div>
                <!-- 月份按鈕 -->
                <div id="monthQuickNavButtons" class="grid w-full grid-cols-4 gap-2 sm:w-auto sm:grid-cols-6 md:grid-cols-12 mt-4 sm:mt-0">
                    <!-- JavaScript 會動態生成 12 個月份按鈕 -->
                </div>
            </div>
        </section>


        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-2">
            <input type="text" id="keywordInput" placeholder="輸入關鍵字查詢 (例如: PGY, 臨時動議)"
                   class="col-span-1 md:col-span-3 px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-base">

            <div class="flex flex-col sm:flex-row gap-4 col-span-1 md:col-span-2">
                <input type="date" id="startDateInput"
                       class="flex-grow px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-sm">
                <input type="date" id="endDateInput"
                       class="flex-grow px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-sm">
            </div>

            <div class="flex flex-col sm:flex-row gap-4 col-span-1 md:col-span-1">
                <button id="searchButton"
                        class="flex-grow px-6 py-3 bg-blue-700 text-white font-bold rounded-lg shadow-md hover:bg-blue-800 focus:outline-none transition duration-150 ease-in-out">
                    搜尋
                </button>
                <button id="showAllButton"
                        class="flex-grow px-6 py-3 bg-teal-600 text-white font-bold rounded-lg shadow-md hover:bg-teal-700 focus:outline-none transition duration-150 ease-in-out">
                    顯示全部
                </button>
            </div>
        </div>

        <!-- 訊息顯示區塊 -->
        <div id="messageContainer" class="mt-4 p-4 rounded-md hidden transition">
            <p id="messageText" class="text-center font-bold"></p>
        </div>
    </div>

    <div id="resultsContainer" class="bg-white p-8 rounded-xl shadow-lg w-full max-w-5xl border border-gray-200 flex-grow scrollable-content overflow-y-auto space-y-6">
        <p class="text-gray-400 font-medium text-center py-10" id="initialMessage">請輸入關鍵字、選擇日期區間或點擊「顯示全部」來查詢。</p>
        <!-- 查詢結果將顯示在這裡 -->
    </div>

    <!-- 登入視窗 -->
    <div id="loginModal" class="fixed inset-0 hidden items-center justify-center modal-overlay">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm modal-content relative">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">管理員驗證</h2>
            <div class="mb-4">
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">帳號</label>
                <input type="text" id="username" class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">密碼</label>
                <input type="password" id="password" class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none">
            </div>
            <p id="loginMessage" class="text-red-600 text-sm mb-4 hidden text-center font-bold"></p>
            <div class="flex justify-end gap-3 mt-8">
                <button id="cancelLoginButton" class="w-full py-3 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 transition">取消</button>
                <button id="loginButton" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow-md hover:bg-blue-700 transition">登入</button>
            </div>
        </div>
    </div>

    <!-- 文件預覽模態視窗 -->
    <div id="documentViewerModal" class="flex-col">
        <div class="document-viewer-content">
            <button class="document-viewer-close hover:text-black transition" id="closeDocumentViewer">&times;</button>
            <iframe id="documentViewerIframe" class="document-viewer-iframe rounded-lg"></iframe>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 查詢功能相關元素
            const keywordInput = document.getElementById('keywordInput');
            const startDateInput = document.getElementById('startDateInput');
            const endDateInput = document.getElementById('endDateInput');
            const searchButton = document.getElementById('searchButton');
            const showAllButton = document.getElementById('showAllButton');
            const resultsContainer = document.getElementById('resultsContainer');
            const messageContainer = document.getElementById('messageContainer');
            const messageText = document.getElementById('messageText');
            const initialMessage = document.getElementById('initialMessage');
            const monthQuickNavYearLabel = document.getElementById('monthQuickNavYear');
            const monthQuickNavButtons = document.getElementById('monthQuickNavButtons');
            const prevYearButton = document.getElementById('prevYearButton');
            const nextYearButton = document.getElementById('nextYearButton');
            const monthButtonBaseClasses = 'flex cursor-pointer flex-col items-center justify-center gap-1 rounded-lg border border-blue-200 bg-white px-2 py-2 text-center text-slate-600 shadow-sm transition hover:-translate-y-0.5 hover:border-blue-400 hover:bg-blue-50 focus:outline-none disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-white disabled:hover:border-blue-200 disabled:hover:translate-y-0';
            
            let currentNavYear = getDefaultRocYear();

            // 登入功能相關元素
            const addMeetingButton = document.getElementById('addMeetingButton');
            const loginModal = document.getElementById('loginModal');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginButton = document.getElementById('loginButton');
            const cancelLoginButton = document.getElementById('cancelLoginButton');
            const loginMessage = document.getElementById('loginMessage');

            // 文件預覽模態視窗元素
            const documentViewerModal = document.getElementById('documentViewerModal');
            const documentViewerIframe = document.getElementById('documentViewerIframe');
            const closeDocumentViewerButton = document.getElementById('closeDocumentViewer');

            // Apps Script Web 應用程式 URL
            const APPS_SCRIPT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxgkjyZdtiSBDMuHtuwJweCeyxXVzGnn8VtwnvhXwyQMcPthHpdtoAIZgeeAWixJICm/exec';
            const MEETING_INPUT_PAGE_URL = 'meeting-record-form.html';

            // --- 查詢功能相關邏輯 ---
            
            function showMessage(text, type = 'info') {
                messageText.textContent = text;
                messageContainer.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800', 'bg-blue-100', 'text-blue-800');
                if (type === 'success') {
                    messageContainer.classList.add('bg-green-100', 'text-green-800');
                } else if (type === 'error') {
                    messageContainer.classList.add('bg-red-100', 'text-red-800');
                } else {
                    messageContainer.classList.add('bg-blue-100', 'text-blue-800');
                }
                messageContainer.classList.remove('hidden');
                
                if (type !== 'info') {
                    setTimeout(() => {
                        messageContainer.classList.add('hidden');
                    }, 3000);
                }
            }

            // 確保括號不會被吃掉的高亮函式
            function highlightKeyword(text, keyword) {
                if (!keyword || !text) return String(text || '');
                const textString = String(text);
                try {
                    const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(escapedKeyword, 'gi');
                    return textString.replace(regex, match => `<span class="highlight">${match}</span>`);
                } catch (e) {
                    return textString; 
                }
            }
            
            function getDefaultRocYear() {
                const now = new Date();
                const rocYear = now.getFullYear() - 1911;
                return rocYear > 0 ? rocYear : now.getFullYear();
            }

            function createMonthButtons(year) {
                if (!monthQuickNavButtons) return;
                monthQuickNavButtons.innerHTML = '';
                const months = Array.from({ length: 12 }, (_, index) => index + 1);
                
                months.forEach(month => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.dataset.month = String(month).padStart(2, '0');
                    button.className = monthButtonBaseClasses;
                    button.innerHTML = `
                        <span class="block text-[10px] text-blue-500 whitespace-nowrap" data-role="year-label">${year} 年</span>
                        <span class="block text-sm font-bold text-blue-800 whitespace-nowrap">${month} 月</span>
                    `;
                    button.addEventListener('click', () => {
                        const targetYear = currentNavYear;
                        const targetMonth = button.dataset.month;
                        const adYear = targetYear + 1911;
                        const firstDay = new Date(adYear, targetMonth - 1, 1);
                        const lastDay = new Date(adYear, targetMonth, 0);

                        const formatDateForInput = (date) => {
                            const y = date.getFullYear();
                            const m = String(date.getMonth() + 1).padStart(2, '0');
                            const d = String(date.getDate()).padStart(2, '0');
                            return `${y}-${m}-${d}`;
                        };

                        startDateInput.value = formatDateForInput(firstDay);
                        endDateInput.value = formatDateForInput(lastDay);
                        keywordInput.value = '';
                        performSearch('', startDateInput.value, endDateInput.value);
                    });
                    monthQuickNavButtons.appendChild(button);
                });
            }
            
            function updateMonthNav(year) {
                if (!monthQuickNavButtons || !monthQuickNavYearLabel) return;
                
                const yearToDisplay = year || getDefaultRocYear();
                currentNavYear = yearToDisplay;
                monthQuickNavYearLabel.textContent = `${yearToDisplay} 年`;
                
                monthQuickNavButtons.querySelectorAll('button').forEach(button => {
                    const yearLabel = button.querySelector('[data-role="year-label"]');
                    if (yearLabel) yearLabel.textContent = `${yearToDisplay} 年`;
                    button.disabled = false;
                });

                const currentActualRocYear = getDefaultRocYear();
                nextYearButton.disabled = (currentNavYear >= currentActualRocYear);
            }

            prevYearButton.addEventListener('click', () => {
                updateMonthNav(currentNavYear - 1);
            });

            nextYearButton.addEventListener('click', () => {
                if (currentNavYear < getDefaultRocYear()) {
                    updateMonthNav(currentNavYear + 1);
                }
            });
            
            createMonthButtons(currentNavYear);
            updateMonthNav(currentNavYear);


            function toRocYear(date) {
                if (!(date instanceof Date) || isNaN(date.getTime())) return null;
                const rocYear = date.getFullYear() - 1911;
                return rocYear > 0 ? rocYear : null;
            }

            function parseMeetingDate(rawDate) {
                if (!rawDate) return null;
                if (typeof rawDate === 'number' && rawDate > 25569) {
                    const excelEpoch = new Date(1899, 11, 30);
                    const date = new Date(excelEpoch.getTime() + rawDate * 24 * 60 * 60 * 1000);
                    if (!isNaN(date.getTime())) return date;
                }
                if (rawDate instanceof Date) {
                    return isNaN(rawDate.getTime()) ? null : rawDate;
                }
                const normalized = rawDate.toString().trim().replace(/[年月]/g, '/').replace(/日/g, '').replace(/-/g, '/').replace(/\./g, '/');
                const parts = normalized.split(/[\/]/).filter(Boolean);
                if (parts.length >= 3) {
                    let year = parseInt(parts[0], 10);
                    const month = parseInt(parts[1], 10);
                    const day = parseInt(parts[2], 10);
                    if (!isNaN(year) && !isNaN(month) && !isNaN(day)) {
                        if (year < 1911) year += 1911;
                        const parsedDate = new Date(year, month - 1, day);
                        if (!isNaN(parsedDate.getTime())) return parsedDate;
                    }
                }
                const fallbackDate = new Date(rawDate);
                return isNaN(fallbackDate.getTime()) ? null : fallbackDate;
            }

            function formatDate(dateString) {
                const date = parseMeetingDate(dateString);
                if (!date) return '無';
                try {
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    return `${year}-${month}-${day}`;
                } catch (e) {
                    return String(dateString);
                }
            }

            function formatTime(timeString) {
                if (!timeString) return '無';
                try {
                    if (typeof timeString === 'number' && timeString >= 0 && timeString < 1) {
                        const totalMinutes = Math.round(timeString * 1440);
                        const hours = Math.floor(totalMinutes / 60);
                        const minutes = totalMinutes % 60;
                        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                    }
                    const date = new Date(timeString);
                    if (!isNaN(date.getTime()) && String(timeString).includes('T')) {
                        const hours = String(date.getHours()).padStart(2, '0');
                        const minutes = String(date.getMinutes()).padStart(2, '0');
                        return `${hours}:${minutes}`;
                    }
                    const timeMatch = String(timeString).match(/(\d{1,2}:\d{2})/);
                    if (timeMatch && timeMatch[1]) return timeMatch[1];
                    return String(timeString);
                } catch (e) {
                    return String(timeString);
                }
            }

            function formatCreationTime(dateTimeString) {
                if (!dateTimeString) return '無';
                const date = parseMeetingDate(dateTimeString);
                if (!date) return String(dateTimeString);
                try {
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    const hours = String(date.getHours()).padStart(2, '0');
                    const minutes = String(date.getMinutes()).padStart(2, '0');
                    return `${year}-${month}-${day} ${hours}:${minutes}`;
                } catch (e) {
                    return String(dateTimeString);
                }
            }

            // 完美的附件 UI：保證 () 存在，並提供乾淨按鈕設計
            function formatAttachmentLinks(text, keyword) {
                if (!text) return '';
                const lines = String(text).split('\n').filter(line => line.trim() !== '');
                let html = '<div class="space-y-3">';
                let i = 0;
                
                while (i < lines.length) {
                    const line = lines[i].trim();
                    let description = line;
                    let url = '';

                    // 檢查下一行是否為網址
                    if (i + 1 < lines.length) {
                        const nextLine = lines[i + 1].trim();
                        if (nextLine.toLowerCase().startsWith('http://') || nextLine.toLowerCase().startsWith('https://')) {
                            url = nextLine;
                            i++; // 如果下一行是網址，就跳過
                        }
                    }

                    // 如果這一行本身就是網址
                    if (!url && (line.toLowerCase().startsWith('http://') || line.toLowerCase().startsWith('https://'))) {
                        url = line;
                        description = '附件查閱';
                    }
                    
                    // 萬一說明和網址寫在同一行
                    const urlMatch = line.match(/(https?:\/\/[^\s]+)/);
                    if (!url && urlMatch) {
                        url = urlMatch[0];
                        description = line.replace(url, '').replace(/[：:]$/, '').trim() || '附件查閱';
                    }

                    const isRelevant = keyword ? (description.toLowerCase().includes(keyword) || url.toLowerCase().includes(keyword)) : true;

                    if (isRelevant) {
                        if (url) {
                            html += `
                                <div class="flex flex-col sm:flex-row sm:items-center justify-between p-3 bg-blue-50 border border-blue-100 rounded-lg hover:bg-blue-100 transition duration-150 gap-4">
                                    <span class="text-gray-800 font-medium leading-relaxed">${highlightKeyword(description, keyword)}</span>
                                    <div class="flex shrink-0">
                                        <button type="button" class="px-5 py-2.5 bg-white text-blue-600 border border-blue-200 text-sm font-bold rounded shadow-sm hover:shadow-md hover:bg-blue-50 whitespace-nowrap transition" data-url="${url}" onclick="openDocumentViewer(this.dataset.url)">
                                            下載檔案
                                        </button>
                                    </div>
                                </div>
                            `;
                        } else {
                            html += `<div class="p-3 bg-gray-50 border border-gray-200 rounded-lg text-gray-800 font-medium">${highlightKeyword(description, keyword)}</div>`;
                        }
                    }
                    i++;
                }
                html += '</div>';
                return html;
            }

            // 統一、完美的層級與凸排處理機制
            function formatLines(text, keyword) {
                if (!text) return '';
                const lines = String(text).split('\n');
                let html = '';
                let currentP = null;

                lines.forEach(line => {
                    const trimmed = line.trim();
                    
                    if (trimmed === '') {
                        if (currentP) {
                            // 遇到空行不截斷段落，而是加入高度微小的空隙維持縮排
                            currentP += `<br><span class="block h-1"></span>`;
                        }
                        return; 
                    }

                    let levelClass = '';
                    let isNewBullet = false;

                    if (/^[壹貳參肆伍陸柒捌玖拾]、/.test(trimmed) || /^[一二三四五六七八九十]+、/.test(trimmed)) {
                        levelClass = 'level-1';
                        isNewBullet = true;
                    } else if (/^\d+\./.test(trimmed)) {
                        levelClass = 'level-2';
                        isNewBullet = true;
                    } else if (/^\(\d+\)/.test(trimmed)) {
                        levelClass = 'level-3';
                        isNewBullet = true;
                    }

                    if (isNewBullet) {
                        if (currentP) html += currentP + '</p>';
                        
                        if (levelClass === 'level-1') {
                            // 第一層 (一、二...)：整行加粗
                            currentP = `<p class="${levelClass} font-bold text-gray-800 mt-5">${highlightKeyword(line, keyword)}`;
                        } else if (levelClass === 'level-2') {
                            // 第二層 (1. 2...)：將整個編號標題加粗
                            currentP = `<p class="${levelClass} mt-4 text-gray-800"><strong class="font-semibold">${highlightKeyword(line, keyword)}</strong>`;
                        } else {
                            // 第三層以後正常顯示
                            currentP = `<p class="${levelClass} mt-2 text-gray-700">${highlightKeyword(line, keyword)}`;
                        }
                    } else {
                        if (currentP) {
                            // 同段落的換行，完美繼承上方縮排
                            currentP += `<br>${highlightKeyword(line, keyword)}`;
                        } else {
                            // 無標題的普通段落
                            currentP = `<p class="mt-2 text-gray-700">${highlightKeyword(line, keyword)}`;
                        }
                    }
                });

                if (currentP) html += currentP + '</p>';
                return html;
            }

            function containsKeyword(data, keyword) {
                if (!keyword) return true;
                const lowerKeyword = keyword.toLowerCase();
                for (const key in data) {
                    if (data[key] && typeof data[key] === 'string' && data[key].toLowerCase().includes(lowerKeyword)) {
                        return true;
                    }
                }
                return false;
            }

            // 執行查詢的函數
            async function performSearch(keyword = '', startDate = '', endDate = '', showLatest = false) {
                const lowerKeyword = keyword.toLowerCase().trim();
                
                initialMessage.classList.add('hidden');
                resultsContainer.innerHTML = '';
                showMessage('正在查詢會議內容，請稍候...', 'info');

                try {
                    let url = `${APPS_SCRIPT_WEB_APP_URL}?`;
                    const params = [];
                    if (showLatest) params.push(`showLatest=${showLatest}`);
                    url += params.join('&');

                    const response = await fetch(url);
                    const result = await response.json();

                    if (result.success) {
                        if (result.data && result.data.length > 0) {
                            resultsContainer.innerHTML = '';
                            
                            // 1. 日期過濾 
                            let filteredData = result.data;
                            const start = startDate ? new Date(startDate + 'T00:00:00') : null;
                            const end = endDate ? new Date(endDate + 'T23:59:59') : null;

                            if (start || end) {
                                filteredData = filteredData.filter(meeting => {
                                    const meetingDate = parseMeetingDate(meeting['會議日期']);
                                    if (!meetingDate) return false;
                                    if (start && meetingDate < start) return false;
                                    if (end && meetingDate > end) return false;
                                    return true;
                                });
                            }
                            
                            // 2. 關鍵字過濾
                            if (lowerKeyword) {
                                filteredData = filteredData.filter(meeting => containsKeyword(meeting, lowerKeyword));
                            }
                            
                            // 3. 排序 (日期降序)
                            const sortedData = [...filteredData].sort((a, b) => {
                                const dateA = parseMeetingDate(a['會議日期']);
                                const dateB = parseMeetingDate(b['會議日期']);
                                if (dateA && dateB) return dateB - dateA;
                                if (dateA) return -1;
                                if (dateB) return 1;
                                return 0;
                            });

                            // 檢查是否只有一個「未召開會議」的記錄
                            if (sortedData.length === 1 && sortedData[0]['狀態'] === '未召開') {
                                const meeting = sortedData[0];
                                const meetingDate = parseMeetingDate(meeting['會議日期']);
                                const rocYear = meetingDate ? toRocYear(meetingDate) : currentNavYear;
                                const monthNum = meetingDate ? meetingDate.getMonth() + 1 : '';
                                resultsContainer.innerHTML = `<p class="text-gray-500 font-bold text-center text-xl py-12">${rocYear}年${monthNum}月未召開會議。</p>`;
                                showMessage('查詢完成。', 'success');
                                updateMonthNav(currentNavYear); 
                                return;
                            }


                            let displayedMeetingsCount = 0;
                            let highestRocYear = null;
                            const monthsByYear = new Map();
                            const meetingCards = [];

                            sortedData.forEach(meeting => {
                                if (meeting['狀態'] === '未召開') return;

                                displayedMeetingsCount++;
                                const meetingDate = parseMeetingDate(meeting['會議日期']);
                                const meetingMonth = meetingDate ? String(meetingDate.getMonth() + 1).padStart(2, '0') : null;
                                const meetingRocYear = meetingDate ? toRocYear(meetingDate) : null;

                                if (meetingRocYear !== null) {
                                    if (!monthsByYear.has(meetingRocYear)) {
                                        monthsByYear.set(meetingRocYear, new Set());
                                    }
                                    if (meetingMonth) monthsByYear.get(meetingRocYear).add(meetingMonth);
                                    if (highestRocYear === null || meetingRocYear > highestRocYear) highestRocYear = meetingRocYear;
                                }

                                const meetingCard = document.createElement('div');
                                meetingCard.className = 'bg-white p-8 rounded-2xl shadow border border-gray-100 mb-8';

                                let cardHtml = `
                                    <div class="flex justify-between items-start mb-6 pb-4 border-b border-gray-100">
                                        <h3 class="text-2xl font-black text-blue-900">${highlightKeyword(meeting['會議名稱'] || '無會議名稱', lowerKeyword)}</h3>
                                        <button class="edit-button px-5 py-2 bg-gray-100 text-gray-700 text-sm font-bold rounded-md hover:bg-gray-200 transition-colors shadow-sm whitespace-nowrap" data-row-index="${meeting.rowIndex}">編輯</button>
                                    </div>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                        <p class="text-gray-600"><strong>📅 日期：</strong> ${highlightKeyword(formatDate(meeting['會議日期']), lowerKeyword)}</p>
                                        <p class="text-gray-600"><strong>⏰ 時間：</strong> ${highlightKeyword(formatTime(meeting['開始時間']), lowerKeyword)} - ${highlightKeyword(formatTime(meeting['結束時間']), lowerKeyword)}</p>
                                        <p class="text-gray-600"><strong>📍 地點：</strong> ${highlightKeyword(meeting['會議地點'] || '無', lowerKeyword)}</p>
                                        <p class="text-gray-600"><strong>👤 主席：</strong> ${highlightKeyword(meeting['主席'] || '無', lowerKeyword)}</p>
                                    </div>
                                `;

                                const meetingSections = [
                                    { title: '壹、頒獎表揚', field: '壹、頒獎表揚' },
                                    { title: '貳、主席報告', field: '貳、主席報告' },
                                    { title: '參、上次會議追蹤事項', field: '參、上次會議追蹤事項' },
                                    { title: '肆、本次會議報告及討論事項', field: '肆、本次會議報告及討論事項' },
                                    { title: '伍、臨時動議', field: '伍、臨時動議' },
                                    { title: '陸、下次會議追蹤事項', field: '陸、下次會議追蹤事項' },
                                    { title: '柒、主席結論', field: '柒、主席結論' }
                                ];

                                meetingSections.forEach(section => {
                                    const content = meeting[section.field] || '';
                                    const lowerContent = String(content).toLowerCase();
                                    const isSectionContentRelevant = lowerKeyword ? lowerContent.includes(lowerKeyword) : true;
                                    
                                    const sectionExpandedClass = 'expanded';
                                    const sectionArrowClass = 'expanded';

                                    if (String(content).trim() !== '' && (isSectionContentRelevant || !lowerKeyword)) {
                                        
                                        // 所有的區塊統一使用完美的 formatLines 進行排版
                                        let sectionContentHtml = formatLines(content, lowerKeyword);

                                        if (sectionContentHtml.trim() !== '') {
                                            cardHtml += `
                                                <div class="mt-6">
                                                    <div class="flex items-center cursor-pointer section-header" data-target="${section.field.replace(/[^a-zA-Z0-9]/g, '')}_${meeting.rowIndex}">
                                                        <h4 class="text-lg font-bold text-blue-800">${highlightKeyword(section.title, lowerKeyword)}</h4>
                                                        <svg class="arrow-icon w-5 h-5 text-gray-500 ml-2 ${sectionArrowClass}" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path></svg>
                                                    </div>
                                                    <div id="${section.field.replace(/[^a-zA-Z0-9]/g, '')}_${meeting.rowIndex}" class="section-content mt-3 text-gray-800 ${sectionExpandedClass}">
                                                        ${sectionContentHtml}
                                                    </div>
                                                </div>
                                            `;
                                        }
                                    }
                                });

                                // === 附件部分 ===
                                const attachmentContent = meeting['附件名稱'] || '';
                                const isAttachmentRelevant = lowerKeyword ? String(attachmentContent).toLowerCase().includes(lowerKeyword) : true;
                                
                                if (String(attachmentContent).trim() !== '' && (isAttachmentRelevant || !lowerKeyword)) {
                                    const attachmentExpandedClass = 'expanded';
                                    const attachmentArrowClass = 'expanded';
                                    const attachmentSectionId = `附件_${meeting.rowIndex}`;

                                    const attachmentLinksHtml = formatAttachmentLinks(attachmentContent, lowerKeyword);
                                    
                                    if (attachmentLinksHtml) {
                                        cardHtml += `
                                            <div class="mt-8 border-t border-gray-100 pt-6">
                                                <div class="flex items-center cursor-pointer section-header" data-target="${attachmentSectionId}">
                                                    <h4 class="text-lg font-bold text-teal-800">附件下載區</h4>
                                                    <svg class="arrow-icon w-5 h-5 text-gray-500 ml-2 ${attachmentArrowClass}" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path></svg>
                                                </div>
                                                <div id="${attachmentSectionId}" class="section-content mt-4 ${attachmentExpandedClass}">
                                                    ${attachmentLinksHtml}
                                                </div>
                                            </div>
                                        `;
                                    }
                                }

                                cardHtml += `
                                    <div class="mt-8 text-right">
                                        <p class="text-gray-400 text-xs">資料建立於: ${highlightKeyword(formatCreationTime(meeting['建立時間']), lowerKeyword)}</p>
                                    </div>
                                `;
                                meetingCard.innerHTML = cardHtml;
                                meetingCards.push({
                                    element: meetingCard,
                                    month: meetingMonth,
                                    rocYear: meetingRocYear
                                });
                            });

                            const targetYear = highestRocYear !== null ? highestRocYear : currentNavYear;
                            updateMonthNav(targetYear);
                            
                            const monthAnchors = new Set();
                            meetingCards.forEach(({ element, month, rocYear }) => {
                                if (rocYear === targetYear && month && !monthAnchors.has(month)) {
                                    const anchor = document.createElement('div');
                                    anchor.id = `month-${month}`;
                                    anchor.className = 'block h-0 scroll-mt-24';
                                    resultsContainer.appendChild(anchor);
                                    monthAnchors.add(month);
                                }
                                resultsContainer.appendChild(element);
                            });

                            resultsContainer.querySelectorAll('.section-header').forEach(header => {
                                header.addEventListener('click', (event) => {
                                    if (event.target.tagName === 'BUTTON' || event.target.closest('button')) {
                                        return;
                                    }
                                    const targetId = header.dataset.target;
                                    const contentDiv = document.getElementById(targetId);
                                    const arrowIcon = header.querySelector('.arrow-icon');

                                    if (contentDiv) {
                                        contentDiv.classList.toggle('expanded');
                                        arrowIcon.classList.toggle('expanded');
                                    }
                                });
                            });
                            
                            if (displayedMeetingsCount > 0) {
                                showMessage(`找到 ${displayedMeetingsCount} 筆結果。`, 'success');
                            } else {
                                resultsContainer.innerHTML = '<p class="text-gray-500 font-bold text-xl text-center py-12">查無符合條件的會議紀錄。</p>';
                                showMessage('查無符合條件的會議紀錄。', 'info');
                            }

                        } else {
                            resultsContainer.innerHTML = '<p class="text-gray-500 font-bold text-xl text-center py-12">查無符合條件的會議紀錄。</p>';
                            updateMonthNav(currentNavYear);
                            showMessage('查無符合條件的會議紀錄。', 'info');
                        }
                    } else {
                        resultsContainer.innerHTML = `<p class="text-red-500 text-center">查詢失敗: ${result.message}</p>`;
                        showMessage(`查詢失敗: ${result.message}`, 'error');
                    }
                } catch (error) {
                    console.error('查詢過程中發生錯誤:', error);
                    resultsContainer.innerHTML = '<p class="text-red-500 text-center">網路錯誤或 Apps Script 發生問題。請檢查控制台。</p>';
                    showMessage('網路連線錯誤。', 'error');
                }
            }

            // --- 事件綁定 ---

            searchButton.addEventListener('click', () => {
                const keyword = keywordInput.value.trim();
                const startDate = startDateInput.value;
                const endDate = endDateInput.value;
                performSearch(keyword, startDate, endDate);
            });

            showAllButton.addEventListener('click', () => {
                keywordInput.value = '';
                startDateInput.value = '';
                endDateInput.value = '';
                performSearch('', '', '', true);
            });

            keywordInput.addEventListener('keypress', (event) => {
                if (event.key === 'Enter') {
                    searchButton.click();
                }
            });

            // "新增會議" 按鈕
            addMeetingButton.addEventListener('click', () => {
                loginModal.classList.remove('hidden');
                loginModal.classList.add('flex');
                usernameInput.value = '';
                passwordInput.value = '';
                loginMessage.classList.add('hidden');
                usernameInput.focus();
                loginButton.dataset.targetUrl = MEETING_INPUT_PAGE_URL;
            });

            // "編輯" 按鈕 (事件委派)
            resultsContainer.addEventListener('click', (event) => {
                const editButton = event.target.closest('.edit-button');
                if (editButton) {
                    const rowIndex = editButton.dataset.rowIndex;
                    loginModal.classList.remove('hidden');
                    loginModal.classList.add('flex');
                    usernameInput.value = '';
                    passwordInput.value = '';
                    loginMessage.classList.add('hidden');
                    usernameInput.focus();
                    loginButton.dataset.targetUrl = `${MEETING_INPUT_PAGE_URL}?editRow=${rowIndex}`;
                }
            });

            cancelLoginButton.addEventListener('click', () => {
                loginModal.classList.add('hidden');
                loginModal.classList.remove('flex');
            });

            loginButton.addEventListener('click', () => {
                const username = usernameInput.value;
                const password = passwordInput.value;

                if (username === 'cmh9002' && password === 'cmh9002') {
                    loginMessage.classList.add('hidden');
                    loginModal.classList.add('hidden');
                    loginModal.classList.remove('flex');
                    const targetUrl = loginButton.dataset.targetUrl || MEETING_INPUT_PAGE_URL;
                    window.location.href = targetUrl; 
                } else {
                    loginMessage.textContent = '帳號或密碼錯誤，請重新輸入。';
                    loginMessage.classList.remove('hidden');
                }
            });

            usernameInput.addEventListener('keypress', (event) => {
                if (event.key === 'Enter') passwordInput.focus();
            });
            passwordInput.addEventListener('keypress', (event) => {
                if (event.key === 'Enter') loginButton.click();
            });

            // --- 文件預覽視窗邏輯 ---
            window.openDocumentViewer = function(url) {
                let embedUrl = url;
                if (url.includes('docs.google.com/document/d/') || url.includes('docs.google.com/spreadsheets/d/') || url.includes('docs.google.com/presentation/d/')) {
                    embedUrl = url.replace(/\/edit|\/view.*/, '/preview');
                } else if (url.includes('drive.google.com/file/d/')) {
                    embedUrl = url.replace(/\/view\?usp=sharing/, '/preview');
                }
                
                documentViewerIframe.src = embedUrl;
                documentViewerModal.classList.add('flex');
                documentViewerModal.classList.remove('hidden');
            };

            closeDocumentViewerButton.addEventListener('click', () => {
                documentViewerModal.classList.add('hidden');
                documentViewerModal.classList.remove('flex');
                documentViewerIframe.src = ''; 
            });

            documentViewerModal.addEventListener('click', (event) => {
                if (event.target === documentViewerModal) {
                    documentViewerModal.classList.add('hidden');
                    documentViewerModal.classList.remove('flex');
                    documentViewerIframe.src = ''; 
                }
            });

            // 初始載入
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.get('keyword') && !urlParams.get('startDate') && !urlParams.get('endDate')) {
                performSearch('', '', '', true);
            }
        });
    </script>
</body>
</html>
